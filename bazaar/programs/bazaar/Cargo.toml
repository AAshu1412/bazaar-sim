[package]
name = "bazaar"
version = "0.1.0"
description = "Bazaar — 4-player live multiplayer price-war game on MagicBlock"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bazaar"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
commit-reveal-fallback = []
localnet = [] # accept the local VRF test queue; never enable for devnet/mainnet

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
pyth-solana-receiver-sdk = "2.0.0"
anchor-spl = "1.2.2"
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }
ephemeral-rollups-sdk = { version = "0.20.0", features = ["anchor", "vrf"] }
# ScheduleTask (cranks) is built directly: the SDK's `crank` feature does not compile on 0.20.0
magicblock-magic-program-api = "2.0.0"
bincode = "1.3.3"
