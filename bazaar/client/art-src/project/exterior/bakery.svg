<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 302 256" width="302" height="256">
  <g stroke="#3a2a22" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- plaza -->
    <polygon points="151,128 271,190 151,252 31,190" fill="#a89a80"/>
    <polygon points="151,138 253,190 151,242 49,190" fill="#bcae93" stroke="none"/>
